name: Android validation

on:
  push:
    branches:
      - feature/android-runner
      - fix/android-launcher-branding
  pull_request:
    branches:
      - main
      - feature/android-platform-foundation
      - feature/android-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-build:
    name: Generate Android runner, test, and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.ibisclamoris --project-name lunora .

      - name: Generate Lunora Android launcher icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python .github/scripts/generate-android-icons.py
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/drawable-nodpi/lunora_launcher_foreground.png
          grep -q 'android:label="Lunora"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

      - name: Enable Android core library desugaring
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          elif [ -f android/app/build.gradle ]; then
            cat >> android/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

      - name: Prepare repository assets and tests
        run: |
          mkdir -p assets/branding/theme_icons
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Run tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build Android release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunora-Android-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
