name: Flutter CI and Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Read and validate application version
        id: app-version
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+([0-9]+))?\s*$') {
            throw "Could not read a valid version from pubspec.yaml"
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag") {
            $expectedTag = "v$version"
            if ("${{ github.ref_name }}" -ne $expectedTag) {
              throw "Tag ${{ github.ref_name }} does not match pubspec.yaml version $expectedTag"
            }
          }
          Write-Host "Building Lunora $version"

      - name: Generate Lunora branding assets
        shell: pwsh
        run: |\n          .\.github\scripts\generate-branding.ps1\n          .\.github\scripts\generate-theme-icons.ps1

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release --dart-define=APP_VERSION=${{ steps.app-version.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Lunora installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $version = "${{ steps.app-version.outputs.version }}"
          & $iscc "/DAppVersion=$version" installer/Lunora.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $version = "${{ steps.app-version.outputs.version }}"
          $installer = "build/installer/Lunora-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  Lunora-Setup-$version.exe" | Set-Content -Encoding ascii "$installer.sha256"
          Write-Host "SHA-256: $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lunora-Windows-${{ github.sha }}
          path: |
            build/windows/x64/runner/Release/
            build/installer/Lunora-Setup-*.exe
            build/installer/Lunora-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: lunora-release-bundle
          path: |
            build/installer/Lunora-Setup-*.exe
            build/installer/Lunora-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer and checksum
        uses: actions/download-artifact@v4
        with:
          name: lunora-release-bundle
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lunora ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
