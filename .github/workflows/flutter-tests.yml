name: Flutter tests

on:
  push:
    branches:
      - main
      - fix/database-schema-v25
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Lunora installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc /DAppVersion=1.0.0 installer/Lunora.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: Lunora-Windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lunora installer
        uses: actions/upload-artifact@v4
        with:
          name: Lunora-Setup-${{ github.sha }}
          path: build/installer/Lunora-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 14
