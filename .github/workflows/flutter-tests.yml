name: Flutter CI and Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Read and validate application version
        id: app-version
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+([0-9]+))?\s*$') {
            throw "Could not read a valid version from pubspec.yaml"
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag") {
            $expectedTag = "v$version"
            if ("${{ github.ref_name }}" -ne $expectedTag) {
              throw "Tag ${{ github.ref_name }} does not match pubspec.yaml version $expectedTag"
            }
          }
          Write-Host "Building Lunora $version"

      - name: Generate Lunora branding assets
        shell: pwsh
        run: |
          .\.github\scripts\generate-branding.ps1
          .\.github\scripts\generate-theme-icons.ps1

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release --dart-define=APP_VERSION=${{ steps.app-version.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Lunora installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $version = "${{ steps.app-version.outputs.version }}"
          & $iscc "/DAppVersion=$version" "/FLunora-Payload" installer/Lunora.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish installer/Bootstrapper/Lunora.Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/installer/published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "build/installer/published/Lunora-Setup.exe" "build/installer/Lunora-Setup-$version.exe" -Force

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $version = "${{ steps.app-version.outputs.version }}"
          $installer = "build/installer/Lunora-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  Lunora-Setup-$version.exe" | Set-Content -Encoding ascii "$installer.sha256"
          Write-Host "SHA-256: $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Lunora-Windows-${{ github.sha }}
          path: |
            build/windows/x64/runner/Release/
            build/installer/Lunora-Setup-*.exe
            build/installer/Lunora-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: lunora-release-bundle
          path: |
            build/installer/Lunora-Setup-*.exe
            build/installer/Lunora-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 1

  android-smoke-build:
    name: Generate Android runner and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name lunora .

      - name: Add Android notification runtime permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("Generated Android manifest was not found")

          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if "android.permission.POST_NOTIFICATIONS" not in source:
              marker = "    <application"
              if marker not in source:
                  raise SystemExit("Android application element was not found")
              source = source.replace(marker, permission + marker, 1)
              manifest.write_text(source)
          print("Configured Android 13+ notification permission")

          PY

      - name: Configure Android notification compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          if not gradle.exists():
              raise SystemExit("Generated Android app Gradle file was not found")

          source = gradle.read_text()
          if "isCoreLibraryDesugaringEnabled" not in source and "coreLibraryDesugaringEnabled" not in source:
              if gradle.suffix == ".kts":
                  source = source.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              else:
                  source = source.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1,
                  )

          if "desugar_jdk_libs" not in source:
              dependency = (
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  if gradle.suffix == ".kts"
                  else "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
              )
              if "dependencies {" not in source:
                  source += "\ndependencies {\n" + dependency + "}\n"
              else:
                  source = source.replace("dependencies {", "dependencies {\n" + dependency, 1)

          gradle.write_text(source)
          print(f"Enabled core library desugaring in {gradle}")
          PY

      - name: Prepare generated asset directory
        run: mkdir -p assets/branding/theme_icons

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android build failed; retrying after a short dependency-download cooldown (attempt $attempt/3)."
              sleep 25
            fi
          done
          exit 1

      - name: Upload Android smoke-test APK
        uses: actions/upload-artifact@v7
        with:
          name: Lunora-Android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer and checksum
        uses: actions/download-artifact@v8
        with:
          name: lunora-release-bundle
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lunora ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
